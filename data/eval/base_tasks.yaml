# Source of the eval set. Built into data/eval/eval_set.jsonl by
#   python -m transit_agent.build_eval      (from the repo root, with PYTHONPATH=src)
#
# One entry per base task; every task is written in four languages:
#   en        English
#   hi        Hindi, Devanagari
#   mr        Marathi, Devanagari
#   hinglish  Hindi-English code-mixed, Roman script
# The non-English text was model-generated and has NOT been reviewed by native speakers yet
# (data/eval/DATACARD.md, data/eval/review_checklist.csv).
#
# turns:  the conversation before the agent's turn. A `user` / `assistant` turn holds a
#         {lang: text} mapping. `assistant: propose_booking` / `assistant: propose_cancel` is
#         rendered from the task's `booking` / `cancel` block with real numbers from the mock
#         backend (service, departure time, fare), so history can never drift from the data.
# calls:  expected tool calls, as a list of steps (one step = the calls of one assistant turn).
#         An argument value may be a {lang: value} mapping (the station name as the user wrote
#         it). `$earliest(FROM,TO,DATE,CLASS)` = service_id of the earliest train on that date
#         that has CLASS; `$metro(CITY,FROM,TO)` = the metro route's service_id;
#         `$booking` = the task's booking block as book_ticket arguments.

