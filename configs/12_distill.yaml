# Stage 3: LoRA SFT of Tiny Aya on the filtered teacher trajectories (create_distill_trainer).
#   python -m latentspace_train distill [--push]
extends: base.yaml
distill:
  data: outputs/teacher_collect/filtered.jsonl
  data_hub_repo: null      # or kanishk001/latentspace-transit-teacher-trajectories
  tool_call_format: cohere # cohere (what the fallback prompt asks for) | agenttune (<tool_call>)
  training:                # -> TRL SFTConfig
    num_train_epochs: 3           # a checkpoint per epoch; the epoch is chosen on the dev split
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 2.0e-4
    lr_scheduler_type: cosine
    warmup_steps: 10
    # Must hold the whole example. The system prompt (policy + 8 tool schemas) is ~3,400
    # tokens and the longest trajectory ~4,900. Round 1 used 2048, which cut every example
    # inside the tool list: the student was never trained on a user turn or an answer.
    max_length: 6144
    gradient_checkpointing: true
    logging_steps: 5
    save_strategy: epoch
    save_total_limit: 3
