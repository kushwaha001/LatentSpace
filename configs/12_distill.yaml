# Stage 3: LoRA SFT of Tiny Aya on the filtered teacher trajectories (create_distill_trainer).
#   python -m latentspace_train distill [--push]
extends: base.yaml
distill:
  data: outputs/teacher_collect/filtered.jsonl
  data_hub_repo: null      # or kanishk001/latentspace-transit-teacher-trajectories
  tool_call_format: cohere # cohere (what the fallback prompt asks for) | agenttune (<tool_call>)
  training:                # -> TRL SFTConfig
    num_train_epochs: 2
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    lr_scheduler_type: cosine
    warmup_steps: 10
    max_length: 2048
    gradient_checkpointing: true
    logging_steps: 5
    save_strategy: "no"
