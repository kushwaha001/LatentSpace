# Stage 5: held-out test split, 5 trials per task, per language, bootstrap between runs.
#   python -m latentspace_train evaluate                 # every checkpoint below
#   python -m latentspace_train evaluate --run run_B     # one checkpoint
extends: base.yaml
student:
  quantization: null       # inference only: fp16 weights (6.7 GB) fit a T4 and decode ~2x faster than 4-bit
generation: {temperature: 0.7, max_new_tokens: 256}
evaluate:
  split: test
  trials: 5
  independent_trials: false   # true only if the tools keep no state between trials
  skip_missing: true          # skip checkpoints whose adapter is not on disk yet
  checkpoints:
    - {name: base}
    - {name: distill, adapter: distill/adapter}
    - {name: run_A, adapter: grpo/run_A/adapter}
    - {name: run_B, adapter: grpo/run_B/adapter}
    - {name: run_B2, adapter: grpo/run_B2/adapter}
    - {name: run_B3, adapter: grpo/run_B3/adapter, base_adapter: distill/adapter}
    - {name: run_A3, adapter: grpo/run_A3/adapter, base_adapter: distill/adapter}
    - {name: dpo_audit, adapter: dpo/audit/adapter, base_adapter: distill/adapter}
    - {name: dpo_bal, adapter: dpo/bal/adapter, base_adapter: distill/adapter}
    - {name: distill_unfiltered, adapter: ablation_unfiltered/distill/adapter}
    # Hub adapters work too: {name: run_B_hub, adapter: kanishk001/tiny-aya-global-transit-grpo-audit-reward-lora}
    # API reference (no GPU): {name: base_api, backend: router, model: "CohereLabs/tiny-aya-global:cohere", max_usd: 1}
  comparisons:
    - [run_A, run_B]
    - [base, run_B]
    - [distill, run_B]
    - [run_A, run_B2]
    - [base, run_B2]
    - [distill, run_B2]
    - [run_B, run_B2]
    - [distill, run_B3]
    - [run_A3, run_B3]
    - [run_B2, run_B3]
    - [distill, dpo_audit]
    - [run_A, dpo_audit]
    - [run_B3, dpo_audit]
    - [distill, dpo_bal]
    - [run_A, dpo_bal]
    - [distill_unfiltered, distill]
    - [run_A3, run_B3]
    - [distill, run_A3]
    - [base, run_A]
    - [base, distill]
  n_resamples: 10000
