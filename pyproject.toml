[project]
name = "latentspace"
version = "0.1.0"
description = "Audit-grounded rewards for training reliable, safe tool-calling agents (AgentTune + AuditKIT)"
requires-python = ">=3.12"
dependencies = ["auditkit>=1.1.3", "agenttune"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
